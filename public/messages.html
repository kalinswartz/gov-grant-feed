<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messages – TTI Funding</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      /* ── Messages layout ── */
      .messages-layout {
        display: flex;
        height: calc(100vh - 64px);
        overflow: hidden;
        max-width: 1200px;
        margin: 0 auto;
        border: 1px solid var(--border);
        border-top: none;
      }

      /* ── Sidebar ── */
      .convo-sidebar {
        width: 320px;
        min-width: 260px;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        background: var(--card-bg);
        flex-shrink: 0;
      }

      .convo-sidebar-header {
        padding: 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .convo-sidebar-header h2 {
        font-size: 1rem;
        font-weight: 600;
        margin: 0;
      }

      .convo-search {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
      }

      .convo-search input {
        width: 100%;
        padding: 7px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--text);
        font-size: 0.85rem;
        box-sizing: border-box;
      }

      .convo-search input:focus {
        outline: none;
        border-color: var(--accent);
      }

      .convo-list {
        flex: 1;
        overflow-y: auto;
      }

      .convo-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        cursor: pointer;
        border-bottom: 1px solid var(--border);
        transition: background 0.15s;
      }

      .convo-item:hover {
        background: var(--hover-bg, rgba(0,0,0,0.03));
      }

      .convo-item.active {
        background: var(--accent-light, rgba(59,130,246,0.08));
        border-left: 3px solid var(--accent);
        padding-left: 13px;
      }

      .convo-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 1rem;
        flex-shrink: 0;
      }

      .convo-info {
        flex: 1;
        min-width: 0;
      }

      .convo-name-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 4px;
      }

      .convo-name {
        font-weight: 600;
        font-size: 0.88rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .convo-time {
        font-size: 0.72rem;
        color: var(--muted);
        white-space: nowrap;
        flex-shrink: 0;
      }

      .convo-preview {
        font-size: 0.78rem;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 2px;
      }

      .convo-unread {
        background: var(--accent);
        color: #fff;
        border-radius: 999px;
        font-size: 0.7rem;
        font-weight: 700;
        padding: 1px 6px;
        min-width: 18px;
        text-align: center;
        flex-shrink: 0;
      }

      .convo-empty {
        padding: 40px 16px;
        text-align: center;
        color: var(--muted);
        font-size: 0.88rem;
        line-height: 1.6;
      }

      /* ── Thread panel ── */
      .thread-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: var(--bg);
      }

      .thread-header {
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--card-bg);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .thread-header-left {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .thread-user-name {
        font-weight: 600;
        font-size: 0.95rem;
      }

      .thread-user-sub {
        font-size: 0.75rem;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .thread-messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .thread-empty {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        font-size: 0.9rem;
        flex-direction: column;
        gap: 8px;
      }

      /* ── Message bubbles ── */
      .msg-row {
        display: flex;
        gap: 8px;
        margin-bottom: 2px;
      }

      .msg-row.own {
        flex-direction: row-reverse;
      }

      .msg-row.own + .msg-row.own .msg-avatar,
      .msg-row:not(.own) + .msg-row:not(.own) .msg-avatar {
        visibility: hidden;
      }

      .msg-avatar {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 0.75rem;
        flex-shrink: 0;
        align-self: flex-end;
      }

      .msg-avatar.other {
        background: var(--muted);
      }

      .msg-body {
        max-width: 65%;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .msg-row.own .msg-body {
        align-items: flex-end;
      }

      .msg-bubble {
        padding: 8px 13px;
        border-radius: 16px;
        font-size: 0.88rem;
        line-height: 1.5;
        word-break: break-word;
        position: relative;
      }

      .msg-row.own .msg-bubble {
        background: var(--accent);
        color: #fff;
        border-bottom-right-radius: 4px;
      }

      .msg-row:not(.own) .msg-bubble {
        background: var(--card-bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-bottom-left-radius: 4px;
      }

      .msg-bubble.deleted {
        font-style: italic;
        opacity: 0.55;
      }

      .msg-meta {
        font-size: 0.68rem;
        color: var(--muted);
        padding: 0 4px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .msg-edited {
        font-size: 0.65rem;
        opacity: 0.7;
      }

      .msg-row:hover .msg-actions {
        display: flex;
      }

      /* date divider */
      .date-divider {
        text-align: center;
        font-size: 0.72rem;
        color: var(--muted);
        margin: 12px 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .date-divider::before,
      .date-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      /* ── Compose bar ── */
      .compose-bar {
        padding: 12px 16px;
        border-top: 1px solid var(--border);
        background: var(--card-bg);
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }

      .compose-bar textarea {
        flex: 1;
        resize: none;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 14px;
        font-size: 0.88rem;
        font-family: inherit;
        background: var(--bg);
        color: var(--text);
        line-height: 1.4;
        max-height: 120px;
        min-height: 42px;
        box-sizing: border-box;
      }

      .compose-bar textarea:focus {
        outline: none;
        border-color: var(--accent);
      }

      .send-btn {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 10px;
        padding: 10px 18px;
        font-size: 0.88rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
        flex-shrink: 0;
      }

      .send-btn:hover:not(:disabled) {
        filter: brightness(1.1);
      }

      .send-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* ── No conversation selected ── */
      .no-convo {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        gap: 10px;
      }

      .no-convo-icon {
        font-size: 3rem;
        opacity: 0.4;
      }

      /* ── New message modal ── */
      .new-msg-user-list {
        max-height: 300px;
        overflow-y: auto;
        margin-top: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      .new-msg-user-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        cursor: pointer;
        border-bottom: 1px solid var(--border);
        transition: background 0.15s;
      }

      .new-msg-user-item:last-child {
        border-bottom: none;
      }

      .new-msg-user-item:hover {
        background: var(--hover-bg, rgba(0,0,0,0.03));
      }

      .new-msg-user-avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 0.85rem;
        flex-shrink: 0;
      }

      .new-msg-user-info .name {
        font-weight: 600;
        font-size: 0.88rem;
      }

      .new-msg-user-info .sub {
        font-size: 0.75rem;
        color: var(--muted);
      }

      /* ── Edit message input ── */
      .edit-input {
        width: 100%;
        border: 1px solid var(--accent);
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 0.88rem;
        font-family: inherit;
        background: var(--bg);
        color: var(--text);
        box-sizing: border-box;
        resize: none;
      }

      .edit-input:focus {
        outline: none;
      }

      .edit-actions {
        display: flex;
        gap: 6px;
        margin-top: 4px;
      }

      /* ── Unread badge ── */
      .unread-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--red, #ef4444);
        color: #fff;
        border-radius: 999px;
        font-size: 0.65rem;
        font-weight: 700;
        min-width: 16px;
        height: 16px;
        padding: 0 4px;
        margin-left: 2px;
        vertical-align: middle;
      }

      /* ── Mobile ── */
      @media (max-width: 640px) {
        .messages-layout {
          height: calc(100vh - 64px);
        }

        .convo-sidebar {
          width: 100%;
          min-width: unset;
          border-right: none;
        }

        .convo-sidebar.hidden-mobile {
          display: none;
        }

        .thread-panel {
          display: none;
        }

        .thread-panel.show-mobile {
          display: flex;
        }

        .back-btn {
          display: flex !important;
        }
      }

      .back-btn {
        display: none;
        align-items: center;
        gap: 4px;
        background: none;
        border: none;
        cursor: pointer;
        color: var(--accent);
        font-size: 0.88rem;
        padding: 4px 8px;
        border-radius: 6px;
      }

      .back-btn:hover {
        background: var(--border);
      }
    </style>
  </head>
  <body>

    <header>
      <div class="logo" style="cursor:pointer" onclick="window.location.href='/'">
        🏛️ TTI Funding Opportunities
      </div>
      <div class="header-right">
        <button class="btn-outline btn-sm" onclick="window.location.href='/'">
          ← Back to Feed
        </button>
      </div>
    </header>

    <div class="messages-layout" id="messages-layout">

      <!-- ── Sidebar ── -->
      <div class="convo-sidebar" id="convo-sidebar">
        <div class="convo-sidebar-header">
          <h2>💬 Messages</h2>
          <button class="btn-primary btn-sm" onclick="openNewMessageModal()">
            ✏️ New
          </button>
        </div>
        <div class="convo-search">
          <input
                        type="text"
            id="convo-search-input"
            placeholder="Search conversations..."
            oninput="filterConvoList()"
          />
        </div>
        <div class="convo-list" id="convo-list">
          <div class="loading">
            <div class="spinner"></div>
            <span>Loading...</span>
          </div>
        </div>
      </div>

      <!-- ── Thread Panel ── -->
      <div class="thread-panel" id="thread-panel">
        <div class="no-convo" id="no-convo-placeholder">
          <div class="no-convo-icon">💬</div>
          <div>Select a conversation or start a new one</div>
          <button class="btn-primary btn-sm" onclick="openNewMessageModal()">
            ✏️ New Message
          </button>
        </div>
      </div>

    </div>

    <!-- Toast -->
    <div id="toast"></div>

    <!-- ── New Message Modal ── -->
    <div class="modal-overlay" id="new-msg-modal" onclick="closeNewMessageModal(event)">
      <div class="modal">
        <h2>
          New Message
          <button class="modal-close" onclick="closeNewMessageModal()">✕</button>
        </h2>
        <input
          type="text"
          id="new-msg-search"
          placeholder="Search users..."
          oninput="filterUserList()"
          style="width:100%;padding:8px 12px;border:1px solid var(--border);
                 border-radius:8px;background:var(--bg);color:var(--text);
                 font-size:0.88rem;box-sizing:border-box;"
        />
        <div class="new-msg-user-list" id="new-msg-user-list">
          <div style="padding:20px;text-align:center;color:var(--muted)">
            Loading users...
          </div>
        </div>
      </div>
    </div>


    <script src="/messages.js"></script>
  </body>
</html>
