<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TTI Funding Opportunities — Login</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .auth-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .auth-box {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 40px;
        width: 100%;
        max-width: 420px;
        box-shadow: var(--shadow);
      }

      .auth-logo {
        text-align: center;
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--accent);
        margin-bottom: 8px;
      }

      .auth-subtitle {
        text-align: center;
        font-size: 0.875rem;
        color: var(--muted);
        margin-bottom: 32px;
      }

      .auth-tabs {
        display: flex;
        gap: 0;
        margin-bottom: 28px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }

      .auth-tab {
        flex: 1;
        padding: 10px;
        background: transparent;
        border: none;
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        border-radius: 0;
      }

      .auth-tab.active {
        background: var(--accent);
        color: #fff;
      }

      .auth-tab:hover:not(.active) {
        background: var(--surface2);
        color: var(--text);
      }

      .form-group {
        margin-bottom: 18px;
      }

      .form-group label {
        display: block;
        font-size: 0.82rem;
        color: var(--muted);
        margin-bottom: 6px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: .04em;
      }

      .form-group input {
        width: 100%;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text);
        padding: 10px 14px;
        font-size: 0.95rem;
        outline: none;
        transition: border-color 0.2s;
      }

      .form-group input:focus {
        border-color: var(--accent);
      }

      .auth-btn {
        width: 100%;
        padding: 12px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: var(--radius);
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s;
        margin-top: 8px;
      }

      .auth-btn:hover   { background: #3a7ae8; }
      .auth-btn:active  { transform: scale(0.98); }
      .auth-btn:disabled {
        opacity: 0.6;
        cursor: default;
        transform: none;
      }

      .auth-error {
        background: rgba(224,92,92,.12);
        border: 1px solid rgba(224,92,92,.35);
        color: var(--red);
        border-radius: var(--radius);
        padding: 10px 14px;
        font-size: 0.875rem;
        margin-bottom: 16px;
        display: none;
      }

      .auth-error.show { display: block; }

      .auth-success {
        background: rgba(62,207,142,.12);
        border: 1px solid rgba(62,207,142,.35);
        color: var(--green);
        border-radius: var(--radius);
        padding: 10px 14px;
        font-size: 0.875rem;
        margin-bottom: 16px;
        display: none;
      }

      .auth-success.show { display: block; }

      .auth-hint {
        text-align: center;
        font-size: 0.78rem;
        color: var(--muted);
        margin-top: 20px;
        line-height: 1.6;
      }

      .form-panel { display: none; }
      .form-panel.active { display: block; }
    </style>
  </head>

  <body>
    <div class="auth-page">
      <div class="auth-box">

        <div class="auth-logo">🏛️ TTI Funding Opportunities</div>
        <div class="auth-subtitle">Texas A&M Transportation Institute</div>

        <!-- Tabs -->
        <div class="auth-tabs">
          <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">
            Sign In
          </button>
          <button class="auth-tab" id="tab-register" onclick="switchTab('register')">
            Create Account
          </button>
        </div>

        <!-- Error / Success -->
        <div class="auth-error"   id="auth-error"></div>
        <div class="auth-success" id="auth-success"></div>

        <!-- Login Form -->
        <div class="form-panel active" id="panel-login">
          <div class="form-group">
            <label for="login-username">Username</label>
            <input
              type="text"
              id="login-username"
              placeholder="Enter your username"
              autocomplete="username"
            />
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <input
              type="password"
              id="login-password"
              placeholder="Enter your password"
              autocomplete="current-password"
            />
          </div>
          <button class="auth-btn" id="login-btn" onclick="doLogin()">
            Sign In
          </button>
        </div>

        <!-- Register Form -->
        <div class="form-panel" id="panel-register">
          <div class="form-group">
            <label for="reg-username">Username</label>
            <input
              type="text"
              id="reg-username"
              placeholder="Choose a username (min 3 chars)"
              autocomplete="username"
            />
          </div>
          <div class="form-group">
            <label for="reg-password">Password</label>
            <input
              type="password"
              id="reg-password"
              placeholder="Choose a password (min 6 chars)"
              autocomplete="new-password"
            />
          </div>
          <div class="form-group">
            <label for="reg-confirm">Confirm Password</label>
            <input
              type="password"
              id="reg-confirm"
              placeholder="Repeat your password"
              autocomplete="new-password"
            />
          </div>
          <button class="auth-btn" id="register-btn" onclick="doRegister()">
            Create Account
          </button>
        </div>

        <div class="auth-hint" id="auth-hint">
          First account created is automatically an admin.
        </div>

      </div>
    </div>

    <script>
      /* ── Check if already logged in ── */
      (async function() {
        try {
          var res  = await fetch("/auth/me");
          var data = await res.json();
          if (data.loggedIn) {
            window.location.href = "/";
          }
        } catch(e) {}
      })();

      /* ── Tab switch ── */
      function switchTab(tab) {
        document.getElementById("panel-login").classList.toggle("active",    tab === "login");
        document.getElementById("panel-register").classList.toggle("active", tab === "register");
        document.getElementById("tab-login").classList.toggle("active",      tab === "login");
        document.getElementById("tab-register").classList.toggle("active",   tab === "register");
        clearMessages();
      }

      /* ── Login ── */
      async function doLogin() {
        clearMessages();
        var username = document.getElementById("login-username").value.trim();
        var password = document.getElementById("login-password").value;
        var btn      = document.getElementById("login-btn");

        if (!username || !password) {
          showError("Please enter username and password.");
          return;
        }

        btn.disabled    = true;
        btn.textContent = "Signing in...";

        try {
          var res  = await fetch("/auth/login", {
            method:  "POST",
            headers: { "Content-Type": "application/json" },
            body:    JSON.stringify({ username, password }),
          });

          var data = await res.json();

          if (!res.ok) {
            showError(data.error || "Login failed.");
            return;
          }

          showSuccess("Welcome back, " + data.username + "! Redirecting...");
          setTimeout(function() { window.location.href = "/"; }, 800);
        } catch (err) {
          showError("Network error. Please try again.");
        } finally {
          btn.disabled    = false;
          btn.textContent = "Sign In";
        }
      }

      /* ── Register ── */
      async function doRegister() {
        clearMessages();
        var username = document.getElementById("reg-username").value.trim();
        var password = document.getElementById("reg-password").value;
        var confirm  = document.getElementById("reg-confirm").value;
        var btn      = document.getElementById("register-btn");

        if (!username || !password || !confirm) {
          showError("All fields are required.");
          return;
        }

        if (password !== confirm) {
          showError("Passwords do not match.");
          return;
        }

        if (password.length < 6) {
          showError("Password must be at least 6 characters.");
          return;
        }

        btn.disabled    = true;
        btn.textContent = "Creating account...";

        try {
          var res  = await fetch("/auth/register", {
            method:  "POST",
            headers: { "Content-Type": "application/json" },
            body:    JSON.stringify({ username, password }),
          });

          var data = await res.json();

          if (!res.ok) {
            showError(data.error || "Registration failed.");
            return;
          }

          showSuccess("Account created! Welcome, " + data.username + "! Redirecting...");
          setTimeout(function() { window.location.href = "/"; }, 800);
        } catch (err) {
          showError("Network error. Please try again.");
        } finally {
          btn.disabled    = false;
          btn.textContent = "Create Account";
        }
      }

      /* ── Enter key support ── */
      document.addEventListener("keydown", function(e) {
        if (e.key !== "Enter") return;
        var loginActive = document.getElementById("panel-login").classList.contains("active");
        if (loginActive) doLogin();
        else doRegister();
      });

      /* ── Helpers ── */
      function showError(msg) {
        var el = document.getElementById("auth-error");
        el.textContent = msg;
        el.classList.add("show");
      }

      function showSuccess(msg) {
        var el = document.getElementById("auth-success");
        el.textContent = msg;
        el.classList.add("show");
      }

      function clearMessages() {
        document.getElementById("auth-error").classList.remove("show");
        document.getElementById("auth-success").classList.remove("show");
      }
    </script>
  </body>
</html>
