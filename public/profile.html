<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TTI Funding Opportunities — Profile</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .profile-page {
        max-width: 680px;
        margin: 40px auto;
        padding: 24px;
      }

      .profile-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 32px;
        flex-wrap: wrap;
        gap: 12px;
      }

      .profile-header h1 {
        font-size: 1.4rem;
        color: var(--text);
      }

      .back-link {
        color: var(--accent);
        text-decoration: none;
        font-size: 0.875rem;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .back-link:hover { text-decoration: underline; }

      .profile-avatar {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: var(--surface2);
        border: 2px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        margin-bottom: 16px;
        flex-shrink: 0;
      }

      .profile-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 28px;
        margin-bottom: 20px;
      }

      .profile-card-header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border);
      }

      .profile-card-header .info h2 {
        font-size: 1.2rem;
        color: var(--text);
        margin-bottom: 4px;
      }

      .profile-card-header .info p {
        font-size: 0.82rem;
        color: var(--muted);
      }

      .profile-card h3 {
        font-size: 0.85rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: .05em;
        margin-bottom: 18px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .form-grid .full-width {
        grid-column: 1 / -1;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .form-group label {
        font-size: 0.78rem;
        color: var(--muted);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: .04em;
      }

      .form-group input,
      .form-group textarea {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text);
        padding: 9px 12px;
        font-size: 0.9rem;
        outline: none;
        transition: border-color 0.2s;
        font-family: inherit;
        width: 100%;
      }

      .form-group input:focus,
      .form-group textarea:focus {
        border-color: var(--accent);
      }

      .form-group textarea {
        resize: vertical;
        min-height: 80px;
      }

      .form-group .char-count {
        font-size: 0.72rem;
        color: var(--muted);
        text-align: right;
      }

      .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
      }

      .alert {
        border-radius: var(--radius);
        padding: 10px 14px;
        font-size: 0.875rem;
        margin-bottom: 16px;
        display: none;
      }

      .alert.show     { display: block; }
      .alert.success  {
        background: rgba(62,207,142,.12);
        border: 1px solid rgba(62,207,142,.35);
        color: var(--green);
      }
      .alert.error    {
        background: rgba(224,92,92,.12);
        border: 1px solid rgba(224,92,92,.35);
        color: var(--red);
      }

      .role-badge {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 20px;
        font-size: 0.72rem;
        font-weight: 700;
      }

      .role-admin {
        background: rgba(79,142,247,.18);
        color: var(--accent);
        border: 1px solid rgba(79,142,247,.35);
      }

      .role-user {
        background: rgba(136,144,168,.15);
        color: var(--muted);
        border: 1px solid var(--border);
      }

      .member-since {
        font-size: 0.78rem;
        color: var(--muted);
        margin-top: 4px;
      }

      @media (max-width: 560px) {
        .form-grid { grid-template-columns: 1fr; }
      }

  /* ── Resume Upload ── */
  .resume-upload-area {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }

  .resume-upload-area:hover,
  .resume-upload-area.drag-over {
    border-color: var(--accent);
    background: rgba(79,142,247,.05);
  }

  .resume-upload-icon {
    font-size: 2.5rem;
    margin-bottom: 10px;
    opacity: 0.6;
  }

  .resume-upload-text {
    font-size: 0.9rem;
    color: var(--text);
    margin-bottom: 6px;
  }

  .resume-upload-sub {
    font-size: 0.78rem;
    color: var(--muted);
  }

  .resume-browse-link {
    color: var(--accent);
    cursor: pointer;
    text-decoration: underline;
  }

  .resume-preview-field {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 12px;
    font-size: 0.88rem;
    color: var(--text);
  }

  .resume-preview-field.empty {
    color: var(--muted);
    font-style: italic;
  }

    </style>
  </head>

  <body>
    <div class="profile-page">

      <div class="profile-header">
        <h1>👤 My Profile</h1>
        <a href="/" class="back-link">← Back to Feed</a>
      </div>

      <!-- ADD THIS before the existing profile-card div -->
<div class="profile-card" id="resume-card">
  <h3>📄 Import from Resume</h3>

  <div id="resume-alert" class="alert"></div>

  <div class="resume-upload-area" id="resume-drop-zone">
    <div class="resume-upload-icon">📄</div>
    <div class="resume-upload-text">
      Drop your resume PDF here, or
      <label for="resume-file" class="resume-browse-link">browse</label>
    </div>
    <div class="resume-upload-sub">PDF only · max 5MB</div>
    <input
      type="file"
      id="resume-file"
      accept=".pdf"
      style="display:none"
      onchange="handleResumeFile(this.files[0])"
    />
  </div>

  <!-- Parsing state -->
  <div id="resume-parsing" style="display:none;text-align:center;padding:20px;color:var(--muted)">
    <div class="spinner" style="margin:0 auto 12px"></div>
    <div>Reading your resume with AI...</div>
  </div>

  <!-- Preview of extracted fields -->
  <div id="resume-preview" style="display:none">
    <div style="font-size:0.82rem;color:var(--muted);margin-bottom:14px;padding:10px 12px;
                background:rgba(79,142,247,.08);border:1px solid rgba(79,142,247,.2);
                border-radius:8px">
      ✨ AI extracted the fields below from your resume.
      Review them and click <strong>Apply to Profile</strong> to fill in your form.
    </div>

    <div class="form-grid" id="resume-preview-grid">
      <!-- filled dynamically -->
    </div>

    <div class="form-actions" style="margin-top:16px">
      <button class="btn-outline" onclick="cancelResumePreview()">Cancel</button>
      <button class="btn-primary" onclick="applyResumeToProfile()">
        ✅ Apply to Profile
      </button>
    </div>
  </div>
</div>

      <!-- Profile Info Card -->
      <div class="profile-card">

        <div class="profile-card-header">
          <div class="profile-avatar" id="avatar-icon">👤</div>
          <div class="info">
            <h2 id="header-name">—</h2>
            <p id="header-title"></p>
            <p class="member-since" id="header-since"></p>
          </div>
        </div>

        <h3>Profile Information</h3>

        <div id="profile-alert" class="alert"></div>

        <div class="form-grid">
          <div class="form-group">
            <label>Display Name</label>
            <input type="text" id="display_name" placeholder="Your full name" maxlength="100" />
          </div>

          <div class="form-group">
            <label>Username <span style="color:var(--muted)">(cannot change)</span></label>
            <input type="text" id="username_display" disabled
                   style="opacity:0.5;cursor:not-allowed" />
          </div>

          <div class="form-group">
            <label>Job Title</label>
            <input type="text" id="job_title" placeholder="e.g. Research Engineer" maxlength="100" />
          </div>

          <div class="form-group">
            <label>Department</label>
            <input type="text" id="department" placeholder="e.g. Traffic Operations" maxlength="100" />
          </div>

          <div class="form-group">
            <label>Company / Organization</label>
            <input type="text" id="company" placeholder="e.g. Texas A&M TTI" maxlength="100" />
          </div>

          <div class="form-group">
            <label>Location</label>
            <input type="text" id="location" placeholder="e.g. College Station, TX" maxlength="100" />
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="your@email.com" maxlength="200" />
          </div>

          <div class="form-group">
            <label>Phone</label>
            <input type="text" id="phone" placeholder="e.g. (555) 123-4567" maxlength="50" />
          </div>

          <div class="form-group full-width">
            <label>Bio</label>
            <textarea
              id="bio"
              placeholder="Brief description of your research interests or role..."
              maxlength="500"
              oninput="updateCharCount(this, 'bio-count', 500)"
            ></textarea>
            <span class="char-count" id="bio-count">0 / 500</span>
          </div>
        </div>

        <div class="form-actions">
          <button class="btn-outline" onclick="resetProfileForm()">Reset</button>
          <button class="btn-primary" id="save-profile-btn" onclick="saveProfile()">
            Save Profile
          </button>
        </div>
      </div>

      <!-- Change Password Card -->
      <div class="profile-card">
        <h3>Change Password</h3>

        <div id="password-alert" class="alert"></div>

        <div class="form-grid">
          <div class="form-group full-width">
            <label>Current Password</label>
            <input type="password" id="current_password" placeholder="Enter current password" />
          </div>

          <div class="form-group">
            <label>New Password</label>
            <input type="password" id="new_password" placeholder="Min 6 characters" />
          </div>

          <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" id="confirm_password" placeholder="Repeat new password" />
          </div>
        </div>

        <div class="form-actions">
          <button class="btn-primary" id="save-password-btn" onclick="savePassword()">
            Change Password
          </button>
        </div>
      </div>

    </div>

    <script>
      var originalProfile = {};

      /* ── Init ── */
      (async function() {
        try {
          var res  = await fetch("/auth/me");
          var data = await res.json();

          if (!data.loggedIn) {
            window.location.href = "/login.html";
            return;
          }

          loadProfile();
        } catch(e) {
          window.location.href = "/login.html";
        }
      })();

      /* ── Load Profile ── */
      async function loadProfile() {
        try {
          var res  = await fetch("/auth/profile");
          var data = await res.json();

          if (!res.ok) {
            showAlert("profile-alert", data.error || "Failed to load profile.", "error");
            return;
          }

          originalProfile = data;

          /* Populate header */
          var displayName = data.display_name || data.username;
          document.getElementById("header-name").textContent = displayName;

          var titleParts = [];
          if (data.job_title)  titleParts.push(data.job_title);
          if (data.company)    titleParts.push(data.company);
          document.getElementById("header-title").textContent = titleParts.join(" · ") || "";

          if (data.created_at) {
            document.getElementById("header-since").textContent =
              "Member since " + formatDate(data.created_at);
          }

          /* Avatar initial */
          document.getElementById("avatar-icon").textContent =
            (data.display_name || data.username || "?")[0].toUpperCase();

          /* Populate form fields */
          setValue("username_display", data.username);
          setValue("display_name",     data.display_name);
          setValue("job_title",         data.job_title);
          setValue("department",        data.department);
          setValue("company",           data.company);
          setValue("location",          data.location);
          setValue("email",             data.email);
          setValue("phone",             data.phone);
          setValue("bio",               data.bio);

          /* Update bio char count */
          var bioEl = document.getElementById("bio");
          updateCharCount(bioEl, "bio-count", 500);

        } catch(err) {
          showAlert("profile-alert", "Failed to load profile: " + err.message, "error");
        }
      }

      /* ── Save Profile ── */
      async function saveProfile() {
        var btn         = document.getElementById("save-profile-btn");
        btn.disabled    = true;
        btn.textContent = "Saving...";

        try {
          var payload = {
            display_name: document.getElementById("display_name").value.trim(),
            job_title:     document.getElementById("job_title").value.trim(),
            department:    document.getElementById("department").value.trim(),
            company:       document.getElementById("company").value.trim(),
            location:      document.getElementById("location").value.trim(),
            email:         document.getElementById("email").value.trim(),
            phone:         document.getElementById("phone").value.trim(),
            bio:           document.getElementById("bio").value.trim(),
          };

          var res  = await fetch("/auth/profile", {
            method:  "PUT",
            headers: { "Content-Type": "application/json" },
            body:    JSON.stringify(payload),
          });

          var data = await res.json();

          if (!res.ok) {
            showAlert("profile-alert", data.error || "Save failed.", "error");
            return;
          }

          originalProfile = data.profile;

          /* Update header live */
          var displayName = data.profile.display_name || data.profile.username;
          document.getElementById("header-name").textContent = displayName;
          document.getElementById("avatar-icon").textContent =
            displayName[0].toUpperCase();

          var titleParts = [];
          if (data.profile.job_title) titleParts.push(data.profile.job_title);
          if (data.profile.company)   titleParts.push(data.profile.company);
          document.getElementById("header-title").textContent = titleParts.join(" · ") || "";

          showAlert("profile-alert", "✅ Profile saved successfully!", "success");
        } catch(err) {
          showAlert("profile-alert", "Save failed: " + err.message, "error");
        } finally {
          btn.disabled    = false;
          btn.textContent = "Save Profile";
        }
      }

      /* ── Save Password ── */
      async function savePassword() {
        var current  = document.getElementById("current_password").value;
        var newPass  = document.getElementById("new_password").value;
        var confirm  = document.getElementById("confirm_password").value;
        var btn      = document.getElementById("save-password-btn");

        if (!current || !newPass || !confirm) {
          showAlert("password-alert", "All password fields are required.", "error");
          return;
        }

        if (newPass !== confirm) {
          showAlert("password-alert", "New passwords do not match.", "error");
          return;
        }

        if (newPass.length < 6) {
          showAlert("password-alert", "New password must be at least 6 characters.", "error");
          return;
        }

        btn.disabled    = true;
        btn.textContent = "Changing...";

        try {
          var res  = await fetch("/auth/password", {
            method:  "PUT",
            headers: { "Content-Type": "application/json" },
            body:    JSON.stringify({
              current_password: current,
              new_password:     newPass,
            }),
          });

          var data = await res.json();

          if (!res.ok) {
            showAlert("password-alert", data.error || "Password change failed.", "error");
            return;
          }

          /* Clear the fields */
          document.getElementById("current_password").value = "";
          document.getElementById("new_password").value     = "";
          document.getElementById("confirm_password").value = "";

          showAlert("password-alert", "✅ Password changed successfully!", "success");
        } catch(err) {
          showAlert("password-alert", "Failed: " + err.message, "error");
        } finally {
          btn.disabled    = false;
          btn.textContent = "Change Password";
        }
      }

      /* ── Reset form to last loaded values ── */
      function resetProfileForm() {
        setValue("display_name", originalProfile.display_name);
        setValue("job_title",     originalProfile.job_title);
        setValue("department",    originalProfile.department);
        setValue("company",       originalProfile.company);
        setValue("location",      originalProfile.location);
        setValue("email",         originalProfile.email);
        setValue("phone",         originalProfile.phone);
        setValue("bio",           originalProfile.bio);
        var bioEl = document.getElementById("bio");
        updateCharCount(bioEl, "bio-count", 500);
      }

      /* ── Helpers ── */
      function setValue(id, val) {
        var el = document.getElementById(id);
        if (el) el.value = val || "";
      }

      function updateCharCount(el, countId, max) {
        var countEl = document.getElementById(countId);
        if (countEl) countEl.textContent = el.value.length + " / " + max;
      }

      function showAlert(containerId, msg, type) {
        var el       = document.getElementById(containerId);
        el.textContent = msg;
        el.className   = "alert show " + type;
        clearTimeout(el._timer);
        el._timer = setTimeout(function() {
          el.className = "alert";
        }, 4000);
      }

      function formatDate(isoStr) {
        if (!isoStr) return "—";
        try {
          return new Date(isoStr).toLocaleString(undefined, {
            month: "long", day: "numeric", year: "numeric",
          });
        } catch(e) { return isoStr; }
      }

      /* ════════════════════════════
   Resume Upload + AI Parse
════════════════════════════ */
var parsedResumeData = null;

/* ── Drag and drop ── */
(function setupDragDrop() {
  var zone = document.getElementById("resume-drop-zone");
  if (!zone) return;

  zone.addEventListener("dragover", function(e) {
    e.preventDefault();
    zone.classList.add("drag-over");
  });

  zone.addEventListener("dragleave", function() {
    zone.classList.remove("drag-over");
  });

  zone.addEventListener("drop", function(e) {
    e.preventDefault();
    zone.classList.remove("drag-over");
    var file = e.dataTransfer.files[0];
    if (file) handleResumeFile(file);
  });

  // Click anywhere on zone opens file picker
  zone.addEventListener("click", function(e) {
    if (e.target.tagName !== "LABEL" && e.target.tagName !== "INPUT") {
      document.getElementById("resume-file").click();
    }
  });
})();

/* ── Handle file selected ── */
async function handleResumeFile(file) {
  if (!file) return;

  if (file.type !== "application/pdf") {
    showAlert("resume-alert", "Please upload a PDF file.", "error");
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    showAlert("resume-alert", "File too large (max 5MB).", "error");
    return;
  }

  // Show parsing spinner, hide upload zone
  document.getElementById("resume-drop-zone").style.display = "none";
  document.getElementById("resume-parsing").style.display  = "block";
  document.getElementById("resume-preview").style.display  = "none";
  document.getElementById("resume-alert").className        = "alert";

  try {
    var formData = new FormData();
    formData.append("resume", file);

    var res  = await fetch("/api/resume/parse", {
      method: "POST",
      body:   formData,
    });

    var data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || "Parse failed");
    }

    parsedResumeData = data.profile;
    showResumePreview(data.profile);

  } catch(err) {
    document.getElementById("resume-drop-zone").style.display = "";
    document.getElementById("resume-parsing").style.display  = "none";
    showAlert("resume-alert", "❌ " + err.message, "error");

    // Reset file input so same file can be re-tried
    document.getElementById("resume-file").value = "";
  }
}

/* ── Show preview of extracted data ── */
function showResumePreview(profile) {
  document.getElementById("resume-parsing").style.display = "none";
  document.getElementById("resume-preview").style.display = "block";

  var grid   = document.getElementById("resume-preview-grid");
  var fields = [
    { key: "display_name", label: "Display Name" },
    { key: "job_title",    label: "Job Title" },
    { key: "company",      label: "Company" },
    { key: "department",   label: "Department" },
    { key: "email",        label: "Email" },
    { key: "phone",        label: "Phone" },
    { key: "location",     label: "Location" },
  ];

  grid.innerHTML = fields.map(function(f) {
    var val     = profile[f.key] || "";
    var isEmpty = !val;
    return (
      '<div class="form-group">' +
        '<label>' + f.label + '</label>' +
        '<div class="resume-preview-field' + (isEmpty ? " empty" : "") + '">' +
          (val ? escHtml(val) : "Not found") +
        '</div>' +
      '</div>'
    );
  }).join("") +
  // Bio full width
  '<div class="form-group full-width">' +
    '<label>Bio (AI generated)</label>' +
    '<div class="resume-preview-field' + (!profile.bio ? " empty" : "") + '" ' +
         'style="min-height:60px;white-space:pre-wrap">' +
      (profile.bio ? escHtml(profile.bio) : "Not generated") +
    '</div>' +
  '</div>';
}

/* ── Apply extracted data to profile form ── */
function applyResumeToProfile() {
  if (!parsedResumeData) return;

  var p = parsedResumeData;

  // Only fill fields that have values — don't overwrite with empty strings
  if (p.display_name) setValue("display_name", p.display_name);
  if (p.job_title)    setValue("job_title",    p.job_title);
  if (p.company)      setValue("company",      p.company);
  if (p.department)   setValue("department",   p.department);
  if (p.email)        setValue("email",        p.email);
  if (p.phone)        setValue("phone",        p.phone);
  if (p.location)     setValue("location",     p.location);
  if (p.bio)          setValue("bio",          p.bio);

  // Update bio char count
  var bioEl = document.getElementById("bio");
  updateCharCount(bioEl, "bio-count", 500);

  // Reset resume card back to upload state
  cancelResumePreview();

  showAlert(
    "profile-alert",
    "✨ Profile filled from resume! Review the fields and click Save Profile.",
    "success"
  );

  // Scroll down to profile form
  document.querySelector(".profile-card:nth-child(2)")
    .scrollIntoView({ behavior: "smooth", block: "start" });
}

/* ── Cancel preview, reset upload zone ── */
function cancelResumePreview() {
  parsedResumeData = null;
  document.getElementById("resume-drop-zone").style.display = "";
  document.getElementById("resume-parsing").style.display  = "none";
  document.getElementById("resume-preview").style.display  = "none";
  document.getElementById("resume-file").value             = "";
}

/* ── escHtml needed here too ── */
function escHtml(str) {
  if (!str) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
